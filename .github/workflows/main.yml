name: Build DonutTools

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Find project ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP found in repository root."
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          echo "file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir project

          unzip -q "${{ steps.zip.outputs.file }}" -d project

          echo "Extracted files:"
          find project -maxdepth 3 -type f | sort

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          set -e

          ROOT=$(find project -type f -name "build.gradle" -printf '%h\n' | head -n 1)

          if [ -z "$ROOT" ]; then
            echo "ERROR: build.gradle was not found."
            exit 1
          fi

          echo "Gradle project: $ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -e

          gradle clean build --no-daemon

      - name: Show generated JARs
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          echo "Generated JAR files:"
          find build/libs -maxdepth 1 -type f -name "*.jar" -print

      - name: Upload JAR
        uses: actions/upload-artifact@v6
        with:
          name: DonutTools-0.4.0
          path: project/**/build/libs/*.jar
          if-no-files-found: error
