name: Build DonutTools

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE=$(find . -maxdepth 3 -type f \
            \( -iname "*.zip" -o -iname "*.tar.gz" -o -iname "*.tgz" \) \
            -print -quit)

          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: No project archive found."
            find . -maxdepth 4 -type f -print
            exit 1
          fi

          echo "Found: $ARCHIVE"
          echo "path=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          ARCHIVE="${{ steps.archive.outputs.path }}"

          case "$ARCHIVE" in
            *.zip)
              unzip -oq "$ARCHIVE" -d extracted
              ;;
            *.tar.gz|*.tgz)
              tar -xzf "$ARCHIVE" -C extracted
              ;;
            *)
              echo "ERROR: Unsupported archive format."
              exit 1
              ;;
          esac

          echo "=== Extracted files ==="
          find extracted -maxdepth 5 -type f -print | sort

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT=""

          while IFS= read -r BUILD_FILE; do
            DIR="$(dirname "$BUILD_FILE")"

            if [ -f "$DIR/gradlew" ] && \
               [ -d "$DIR/gradle/wrapper" ]; then
              PROJECT="$DIR"
              break
            fi
          done < <(
            find extracted -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -print
          )

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Complete Gradle project not found."
            echo "Looking for build.gradle + gradlew + gradle/wrapper."
            exit 1
          fi

          PROJECT="$(realpath "$PROJECT")"

          echo "=== Gradle project ==="
          echo "$PROJECT"

          echo "path=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Prepare Gradle
        working-directory: ${{ steps.project.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          chmod +x ./gradlew

      - name: Build Fabric mod
        working-directory: ${{ steps.project.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew build \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Show JAR files
        working-directory: ${{ steps.project.outputs.path }}
        if: success()
        shell: bash
        run: |
          echo "=== BUILD OUTPUT ==="

          find build/libs \
            -type f \
            -name "*.jar" \
            -print

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DonutTools-Fabric-1.26.1
          path: |
            ${{ steps.project.outputs.path }}/build/libs/*.jar
          if-no-files-found: error
