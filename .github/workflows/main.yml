name: Build DonutTools

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project archive
        id: find_zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 3 -type f \( \
            -iname '*.zip' \
            -o -iname '*.tar.gz' \
            -o -iname '*.tgz' \
          \) -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project archive found."
            echo "Files in repository:"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "Found archive: $ZIP_FILE"
          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract project automatically
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          ARCHIVE="${{ steps.find_zip.outputs.zip }}"

          case "$ARCHIVE" in
            *.zip)
              unzip -q "$ARCHIVE" -d extracted
              ;;
            *.tar.gz|*.tgz)
              tar -xzf "$ARCHIVE" -C extracted
              ;;
            *)
              echo "Unsupported archive: $ARCHIVE"
              exit 1
              ;;
          esac

          echo "Extraction completed."
          find extracted -maxdepth 4 -type f | sort

      - name: Locate Gradle project
        id: locate_project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          while IFS= read -r file; do
            DIR="$(dirname "$file")"

            if [ -f "$DIR/build.gradle" ] || \
               [ -f "$DIR/build.gradle.kts" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(
            find extracted \
              -type f \
              \( -name 'build.gradle' -o -name 'build.gradle.kts' \) \
              -print
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find build.gradle or build.gradle.kts"
            exit 1
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "Gradle project found:"
          echo "$PROJECT_DIR"

          echo "project=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build with Gradle
        working-directory: ${{ steps.locate_project.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew build --no-daemon --stacktrace
          else
            echo "ERROR: gradlew was not found."
            echo "The project must contain Gradle Wrapper."
            exit 1
          fi

      - name: Show generated JARs
        if: success()
        working-directory: ${{ steps.locate_project.outputs.project }}
        shell: bash
        run: |
          echo "Generated JAR files:"
          find build/libs -type f -name '*.jar' -print

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DonutTools
          path: |
            ${{ steps.locate_project.outputs.project }}/build/libs/*.jar
          if-no-files-found: error
